name: Windows build and tests

on:
  push:
    branches: [WinUI3]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test "Delete Newline.Tests/Delete Newline.Tests.csproj" -c Release --logger trx
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'

  build:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build "Delete Newline/Delete Newline.csproj" -c Release -p:Platform=${{ matrix.platform }} -p:AppxPackageSigningEnabled=false -p:GenerateAppxPackageOnBuild=false
